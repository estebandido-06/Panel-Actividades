<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Panel de actividades</title>
  </head>
  <body>
    
  <header>
  <h1>Mi panel de actividades</h1>
</header>

<main>
  <section>
    <h2>Tareas de hoy</h2>
    <ul class="tareas-de-hoy">
      <li>Sacar al perro <span class="alta">alta</span></li>
      <li>Hacer Tarea <span class="media">media</span></li>
    </ul>
  </section>

  <section>
    <h2>Nueva tarea</h2>
    <form>
      <label for="titulo">Título de la tarea</label>
      <input type="text" id="titulo" required maxlength="80">
  
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion"></textarea>

      <label for="prioridad">Prioridad</label>
      <select id="prioridad">
        <option>Baja</option>
        <option>Media</option>
        <option>Alta</option>
      </select>

      <button>Crear tarea</button>
    </form>
  </section>
</main>

<footer>
  <p>Panel de actividades, hecho con HTML</p>
</footer>
  </body>
</html>
